name: Build CC26

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build Tweak
        run: make package FINALPACKAGE=1 ROOTLESS=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC26-Rootless
          path: packages/*.deb
